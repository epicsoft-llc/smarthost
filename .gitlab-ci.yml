stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

#### Multi-platform builds need a runner host with QEMU binfmt handlers registered
default:
  tags:
    - imagex

variables:
  DOCKER_REGISTRY: "epicsoft/smarthost"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_TOKEN"

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

develop:
  stage: build
  variables:
    VERSION: "develop"
  script:
    - echo "Build Smarthost Docker image with version '${VERSION}'"
    #### Show the platforms the builder can serve (arm64 needs QEMU binfmt on the runner host)
    - docker buildx inspect --bootstrap
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        --build-arg IMAGE_TAG=latest
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA}
    #### Versions, once per platform
    - for platform in $(echo $BUILD_PLATFORMS | tr ',' ' '); do
        docker run --rm --platform $platform ${CI_REGISTRY_IMAGE}:${VERSION} postconf mail_version;
      done
  only:
    - develop

latest:
  stage: build
  variables:
    VERSION: "latest"
  script:
    - echo "Build Smarthost Docker image with version '${VERSION}'"
    #### Show the platforms the builder can serve (arm64 needs QEMU binfmt on the runner host)
    - docker buildx inspect --bootstrap
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${DOCKER_REGISTRY}:${VERSION}
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA}
    #### Versions, once per platform
    - for platform in $(echo $BUILD_PLATFORMS | tr ',' ' '); do
        docker run --rm --platform $platform ${CI_REGISTRY_IMAGE}:${VERSION} postconf mail_version;
      done
  retry: 2
  only:
    - master

uploadReadme:
  stage: release
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Docker Image for Smarthost (SMTP relay) based on official Alpine image"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
  retry: 2
  only:
    - master
